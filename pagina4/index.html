<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paulo Sereno's Domain</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="navigation">
            <nav>
                <ul>
                    <li><a href="/projeto/index.html">Home</a></li>
                    <li><a href="/projeto/pagina2/index.html">Sobre mim</a></li>
                    <li><a href="/projeto/pagina3/index.html">Skills</a></li>
                    <li><a href="/projeto/pagina4/index.html">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h1>Contactos</h1>   
        <div class="area">
            <div class="contactos">
                <h2>Contacte-me através de:</h2>
                <div class="linkedin">
                    <img src="icon-linkedin.png" alt="LinkedIn Icon">
                    <p><a href="https://www.linkedin.com/in/paulosereno1996/">LinkedIn</a></p>
                </div>
                <div class="github">
                    <img src="icon-github.png" alt="GitHub Icon">
                    <p><a href="https://github.com/paulo-sereno">GitHub</a></p>
                </div>
            </div>
            <div class="formulario">
                <h2>Ou deixando aqui a sua mensagem:</h2>
                    <div class=email>
                        <label for="email">Endereço de e-mail:</label>
                        <input type="email" name="email" placeholder="Digite aqui o seu e-mail">
                    </div>
                    <div class="name">
                        <label for="name"> Nome:</label>
                        <input type="text" name="name" placeholder="Digite aqui o seu nome">
                    </div>
                    <div class="context">
                        <label for="context"> Assunto:</label>
                        <input type="text" name="context" placeholder="Escreva aqui o assunto">
                    </div>
                    <div class="description">
                        <label for="description"> Descrição:</label>
                        <textarea id="description" name="description" placeholder="Escreva aqui a sua mensagem" rows="5"></textarea>
                    </div>
                    <div class="btn">
                        <button class="submit" type="submit">Submeter</button>
                    </div>
            </div>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2025 Paulo Sereno. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
